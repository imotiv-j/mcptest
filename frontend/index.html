<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World - MCP Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        h1 { font-size: 3.5rem; margin: 0 0 1rem 0; }
        p { font-size: 1.2rem; opacity: 0.9; }
        button {
            margin-top: 2rem;
            padding: 12px 32px;
            font-size: 1.1rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello World! 👋</h1>
        <p>Basic frontend ready for Codespaces testing in imotiv-j/mcptest.</p>
        <button onclick="alert('Hello from your MCP test frontend! 🚀')">Click me!</button>
    </div>
</body>
</html>
