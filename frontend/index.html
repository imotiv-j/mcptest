<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Test - File Upload & Viewer</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 2rem;
            background: #f8f9fa;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: #333; }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin: 2rem 0;
            cursor: pointer;
        }
        .upload-area:hover { background: #f0f4ff; }
        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }
        #files-list {
            margin-top: 2rem;
            max-height: 400px;
            overflow-y: auto;
        }
        .file-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .status { margin: 1rem 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📤 File Upload & Viewer</h1>
        
        <div class="upload-area" id="drop-area">
            <h3>Drop files here or click to upload</h3>
            <input type="file" id="fileInput" hidden>
            <button onclick="document.getElementById('fileInput').click()">Select File</button>
        </div>

        <button onclick="loadFiles()">🔄 Refresh File List</button>

        <div id="status" class="status"></div>
        
        <h2>Uploaded Files</h2>
        <div id="files-list">Loading files...</div>
    </div>

    <script>
        const GITHUB_TOKEN = "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";   // ← Replace with your token
        const REPO_OWNER = "imotiv-j";
        const REPO_NAME = "mcptest";
        const BRANCH = "main";

        // Upload File
        async function uploadFile(file) {
            const status = document.getElementById('status');
            status.textContent = `Uploading ${file.name}...`;

            try {
                const reader = new FileReader();
                reader.onload = async (e) => {
                    const content = btoa(unescape(encodeURIComponent(e.target.result)));
                    const path = `uploads/${Date.now()}-${file.name}`;

                    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${GITHUB_TOKEN}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Upload ${file.name}`,
                            content: content,
                            branch: BRANCH
                        })
                    });

                    if (res.ok) {
                        status.innerHTML = `✅ Uploaded: <strong>${file.name}</strong>`;
                        loadFiles(); // Refresh list
                    } else {
                        status.textContent = "❌ Upload failed (Check token & permissions)";
                    }
                };
                reader.readAsText(file);
            } catch (err) {
                status.textContent = "❌ Error: " + err.message;
            }
        }

        // Load and display files in uploads/ folder
        async function loadFiles() {
            const listEl = document.getElementById('files-list');
            listEl.innerHTML = "Loading files...";

            try {
                const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/uploads?ref=${BRANCH}`, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });

                if (res.status === 404) {
                    listEl.innerHTML = "<p>No files uploaded yet.</p>";
                    return;
                }

                const files = await res.json();
                
                if (!Array.isArray(files)) {
                    listEl.innerHTML = "<p>No files found in uploads/ folder.</p>";
                    return;
                }

                let html = '';
                files.forEach(file => {
                    if (file.type === 'file') {
                        const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${file.path}`;
                        html += `
                            <div class="file-item">
                                <span>📄 ${file.name}</span>
                                <a href="${rawUrl}" target="_blank">View Raw</a>
                            </div>`;
                    }
                });

                listEl.innerHTML = html || "<p>No files yet.</p>";
            } catch (err) {
                listEl.innerHTML = "❌ Could not load files. Check token or repo.";
            }
        }

        // Event Listeners
        document.getElementById('fileInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) uploadFile(e.target.files[0]);
        });

        // Drag & Drop
        const dropArea = document.getElementById('drop-area');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#f0f4ff'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files.length > 0) uploadFile(e.dataTransfer.files[0]);
        });

        // Auto load files when page opens
        window.onload = loadFiles;
    </script>
</body>
</html>
