<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Test - Secure Upload</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #f8f9fa; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 2rem; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h1 { text-align: center; }
        .login-box, .upload-area { border: 3px dashed #667eea; border-radius: 12px; padding: 40px; text-align: center; margin: 2rem 0; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        .file-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #status { margin: 1rem 0; font-weight: bold; color: #333; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📤 Secure File Upload</h1>
            <div id="user-info"></div>
        </div>

        <div id="login-section" class="login-box">
            <h2>Welcome</h2>
            <button onclick="loginWithGitHub()">Sign in with GitHub</button>
        </div>

        <div id="main-app" style="display: none;">
            <div class="upload-area" id="drop-area">
                <h3>Drop file here or click to upload</h3>
                <input type="file" id="fileInput" hidden>
                <button onclick="document.getElementById('fileInput').click()">Select File</button>
            </div>

            <button onclick="loadFiles()">🔄 Refresh Files</button>
            <button onclick="logout()">Logout</button>
            <div id="status"></div>
            
            <h2>Your Files</h2>
            <div id="files-list">Loading your files...</div>
        </div>
    </div>

    <script>
        async function checkLogin() {
            const res = await fetch('/api/user');
            if (res.ok) {
                const user = await res.json();
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('user-info').innerHTML = `Logged in as <strong>@${user.login}</strong>`;
                loadFiles();
            }
        }

        function loginWithGitHub() {
            window.location.href = '/auth/github';
        }

        function logout() {
            window.location.href = '/api/logout';
        }

        async function uploadFile(file) {
            const status = document.getElementById('status');
            status.textContent = `Uploading ${file.name}...`;

            const reader = new FileReader();
            reader.onload = async (e) => {
                const content = btoa(unescape(encodeURIComponent(e.target.result)));
                const username = 'PLACEHOLDER'; // will be replaced by session
                const path = `uploads/${username}/${Date.now()}-${file.name}`;

                const res = await fetch('/api/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path, content })
                });

                if (res.ok) {
                    status.innerHTML = `✅ Uploaded: <strong>${file.name}</strong>`;
                    loadFiles();
                } else {
                    status.textContent = '❌ Upload failed';
                }
            };
            reader.readAsText(file);
        }

        async function loadFiles() {
            const listEl = document.getElementById('files-list');
            listEl.innerHTML = 'Loading...';

            try {
                const res = await fetch('/api/files');
                const files = await res.json();

                let html = '';
                files.forEach(file => {
                    const rawUrl = `https://raw.githubusercontent.com/imotiv-j/mcptest/main/${file.path}`;
                    html += `<div class="file-item"><span>📄 ${file.name}</span><a href="${rawUrl}" target="_blank">View</a></div>`;
                });
                listEl.innerHTML = html || '<p>No files yet.</p>';
            } catch (err) {
                listEl.innerHTML = 'Error loading files.';
            }
        }

        // Drag & Drop
        const dropArea = document.getElementById('drop-area');
        dropArea.addEventListener('dragover', e => { e.preventDefault(); dropArea.style.background = '#f0f4ff'; });
        dropArea.addEventListener('dragleave', () => dropArea.style.background = '');
        dropArea.addEventListener('drop', e => {
            e.preventDefault();
            dropArea.style.background = '';
            if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
        });

        document.getElementById('fileInput').addEventListener('change', e => {
            if (e.target.files.length) uploadFile(e.target.files[0]);
        });

        window.onload = checkLogin;
    </script>
</body>
</html>
